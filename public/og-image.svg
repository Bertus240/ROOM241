<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" fill="none">
  <!-- Background -->
  <rect width="1200" height="630" fill="#0A0A0A"/>
  
  <!-- Technical Grid lines (4% opacity) -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#FFFFFF" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#grid)" />

  <!-- Subtle corner grid markings -->
  <path d="M 60 60 L 90 60 M 60 60 L 60 90" stroke="#FFAD00" stroke-width="2" opacity="0.6"/>
  <path d="M 1140 60 L 1110 60 M 1140 60 L 1140 90" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="1"/>
  <path d="M 60 570 L 90 570 M 60 570 L 60 540" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="1"/>
  <path d="M 1140 570 L 1110 570 M 1140 570 L 1140 540" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="1"/>

  <!-- Top label -->
  <text x="100" y="210" fill="#FFAD00" font-family="monospace" font-size="16" font-weight="600" letter-spacing="4">
    ROOM241 / STUDIO B2B
  </text>
  
  <!-- Amber Accent Pill -->
  <rect x="360" y="196" width="12" height="12" fill="#FFAD00"/>

  <!-- Central Title -->
  <text x="100" y="310" fill="#FFFFFF" font-family="sans-serif" font-size="76" font-weight="800" letter-spacing="-2">
    ROOM241
  </text>

  <!-- Subtitle Baseline -->
  <text x="100" y="380" fill="#CCCCCC" font-family="sans-serif" font-size="32" font-weight="500">
    Direction Artistique &amp; Systèmes Visuels B2B
  </text>

  <!-- Divider line -->
  <line x1="100" y1="460" x2="1100" y2="460" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="1"/>

  <!-- Bottom Details -->
  <text x="100" y="515" fill="#666666" font-family="monospace" font-size="16" letter-spacing="1">
    Identité de marque  •  Événementiel grand compte  •  Performance organique
  </text>

  <text x="960" y="515" fill="#555555" font-family="monospace" font-size="14">
    PARIS / LILLE
  </text>
</svg>
